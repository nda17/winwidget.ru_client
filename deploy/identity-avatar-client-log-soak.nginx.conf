log_format winwidget_identity_avatar_client escape=json '{"timestamp":"$time_iso8601","host":"$host","pathClass":"$winwidget_identity_avatar_client_path_class","method":"$request_method","status":$status}';

map $uri $winwidget_identity_avatar_client_path_class {
	default '';
	~^/api/v1/files(?:/|$) api-v1-files;
	~^/uploads(?:/|$) uploads;
	"~^/\.well-known/winwidget/identity-avatar-client/soak-probe/[0-9a-f]{40}/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" soak-probe;
}

map "$host:$winwidget_identity_avatar_client_path_class:$remote_addr:$status" $winwidget_identity_avatar_client_loggable {
	default 0;
	~^winwidget\.ru:api-v1-files: 1;
	~^www\.winwidget\.ru:api-v1-files: 1;
	~^winwidget\.ru:uploads: 1;
	~^www\.winwidget\.ru:uploads: 1;
	winwidget.ru:soak-probe:127.0.0.1:204 1;
}

access_log /var/log/nginx/winwidget.identity-avatar-client.access.log winwidget_identity_avatar_client buffer=64k flush=1s if=$winwidget_identity_avatar_client_loggable;
